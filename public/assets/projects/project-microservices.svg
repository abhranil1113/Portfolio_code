<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1120" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>
    <linearGradient id="accent1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <pattern id="grid1" width="30" height="30" patternUnits="userSpaceOnUse">
      <path d="M 30 0 L 0 0 0 30" fill="none" stroke="rgba(255, 255, 255, 0.05)" stroke-width="1" />
    </pattern>
  </defs>
  <rect width="600" height="340" fill="url(#bg1)" />
  <rect width="600" height="340" fill="url(#grid1)" />
  
  <!-- Architectural Nodes & Flow Lines -->
  <g transform="translate(60, 45)">
    <!-- Header bar -->
    <rect x="0" y="0" width="480" height="36" rx="8" fill="#1e293b" opacity="0.8" />
    <circle cx="20" cy="18" r="5" fill="#ef4444" />
    <circle cx="36" cy="18" r="5" fill="#eab308" />
    <circle cx="52" cy="18" r="5" fill="#22c55e" />
    <text x="80" y="22" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">service.internal.cluster / gateway-v2</text>
    
    <!-- Architecture Diagram Nodes -->
    <!-- Client Node -->
    <rect x="20" y="80" width="90" height="60" rx="8" fill="#0f172a" stroke="#3b82f6" stroke-width="2" />
    <text x="65" y="105" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">API GATEWAY</text>
    <text x="65" y="125" font-family="'JetBrains Mono', monospace" font-size="9" fill="#38bdf8" text-anchor="middle">Kong / Envoy</text>

    <!-- Arrow 1 -->
    <line x1="110" y1="110" x2="180" y2="110" stroke="#60a5fa" stroke-width="2" stroke-dasharray="4,4" />
    
    <!-- Service A -->
    <rect x="180" y="60" width="120" height="50" rx="8" fill="#0f172a" stroke="#6366f1" stroke-width="2" />
    <text x="240" y="82" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Order Service</text>
    <text x="240" y="98" font-family="'JetBrains Mono', monospace" font-size="9" fill="#a5b4fc" text-anchor="middle">Go / gRPC</text>

    <!-- Service B -->
    <rect x="180" y="130" width="120" height="50" rx="8" fill="#0f172a" stroke="#8b5cf6" stroke-width="2" />
    <text x="240" y="152" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#f8fafc" text-anchor="middle">Payment Service</text>
    <text x="240" y="168" font-family="'JetBrains Mono', monospace" font-size="9" fill="#c084fc" text-anchor="middle">FastAPI / Python</text>

    <!-- Arrow 2 -->
    <line x1="300" y1="85" x2="360" y2="110" stroke="#a855f7" stroke-width="2" />
    <line x1="300" y1="155" x2="360" y2="110" stroke="#a855f7" stroke-width="2" />

    <!-- Event Bus / Kafka -->
    <rect x="360" y="80" width="100" height="60" rx="8" fill="#1e1b4b" stroke="#ec4899" stroke-width="2" />
    <text x="410" y="105" font-family="'Inter', sans-serif" font-size="11" font-weight="bold" fill="#fdf2f8" text-anchor="middle">Kafka Bus</text>
    <text x="410" y="125" font-family="'JetBrains Mono', monospace" font-size="9" fill="#f472b6" text-anchor="middle">Partitioned</text>

    <!-- Database Layer -->
    <rect x="180" y="200" width="280" height="40" rx="6" fill="#0f172a" stroke="#10b981" stroke-width="1.5" />
    <text x="320" y="225" font-family="'JetBrains Mono', monospace" font-size="11" fill="#34d399" text-anchor="middle">PostgreSQL HA Cluster + Redis Sentinel</text>
  </g>
</svg>


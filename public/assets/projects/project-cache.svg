<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" width="100%" height="100%">
  <defs>
    <linearGradient id="bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22" />
      <stop offset="100%" stop-color="#064e3b" />
    </linearGradient>
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>
  </defs>
  <rect width="600" height="340" fill="url(#bg2)" />
  
  <g transform="translate(60, 50)">
    <!-- Terminal window container -->
    <rect x="0" y="0" width="480" height="240" rx="12" fill="#041f1a" stroke="#10b981" stroke-width="2" />
    <!-- Terminal bar -->
    <rect x="0" y="0" width="480" height="34" rx="12" fill="#064e3b" />
    <circle cx="20" cy="17" r="5" fill="#ef4444" />
    <circle cx="36" cy="17" r="5" fill="#eab308" />
    <circle cx="52" cy="17" r="5" fill="#10b981" />
    <text x="80" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a7f3d0">kv-cache-engine :: TCP :6379 (Go, Zero-Allocation)</text>

    <!-- Code & Benchmarks -->
    <text x="24" y="65" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399">&gt; memstore.benchmark --concurrency=10000 --keys=1M</text>
    <text x="24" y="90" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">[INFO] Allocating lock-free hash map shards (64 buckets)...</text>
    <text x="24" y="115" font-family="'JetBrains Mono', monospace" font-size="12" fill="#94a3b8">[INFO] Eviction policy: W-TinyLFU with active sampling</text>
    <text x="24" y="145" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#67e8f9">THROUGHPUT: 1,240,000 ops/sec | p99: 0.18ms</text>
    <text x="24" y="170" font-family="'JetBrains Mono', monospace" font-size="12" fill="#a7f3d0">[PERSISTENCE] Append-Only File (AOF) syncer healthy</text>
    <text x="24" y="195" font-family="'JetBrains Mono', monospace" font-size="12" fill="#cbd5e1">[METRICS] Hit Rate: 98.4% | Memory Overhead: &lt; 14MB</text>
    <text x="24" y="222" font-family="'JetBrains Mono', monospace" font-size="13" fill="#34d399">&gt; cluster state: RUNNING_HEALTHY [READY]</text>
  </g>
</svg>


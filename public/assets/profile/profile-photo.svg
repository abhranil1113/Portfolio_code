<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0b1120" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#3b82f6" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="400" height="400" rx="200" fill="url(#bgGrad)" />

  <!-- Subtle Circuit / Terminal Grid -->
  <circle cx="200" cy="200" r="185" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="6,6" opacity="0.6" />
  <circle cx="200" cy="200" r="165" fill="none" stroke="url(#primaryGrad)" stroke-width="1.5" opacity="0.4" />

  <!-- Decorative glow blob behind avatar -->
  <circle cx="200" cy="180" r="90" fill="#3b82f6" opacity="0.15" filter="url(#glow)" />

  <!-- Developer Silhouette / Avatar Illustration -->
  <!-- Shoulders / Torso -->
  <path d="M110 350 C110 270, 150 250, 200 250 C250 250, 290 270, 290 350 Z" fill="#1e293b" stroke="url(#primaryGrad)" stroke-width="2" />
  <!-- Inner shirt collar -->
  <path d="M165 255 L200 300 L235 255 Z" fill="#0f172a" />
  
  <!-- Neck -->
  <rect x="180" y="210" width="40" height="50" rx="6" fill="#cbd5e1" opacity="0.9" />

  <!-- Head -->
  <ellipse cx="200" cy="170" rx="55" ry="65" fill="#e2e8f0" />

  <!-- Hair / Engineering Styling -->
  <path d="M142 165 C140 115, 175 105, 200 105 C230 105, 260 115, 258 165 C250 135, 230 125, 200 125 C170 125, 150 135, 142 165 Z" fill="#1e293b" />

  <!-- Glasses (Software Engineer vibe) -->
  <rect x="160" y="155" width="32" height="22" rx="6" fill="none" stroke="#0ea5e9" stroke-width="2.5" />
  <rect x="208" y="155" width="32" height="22" rx="6" fill="none" stroke="#0ea5e9" stroke-width="2.5" />
  <line x1="192" y1="166" x2="208" y2="166" stroke="#0ea5e9" stroke-width="2.5" />
  <!-- Eyes -->
  <circle cx="176" cy="166" r="3" fill="#0f172a" />
  <circle cx="224" cy="166" r="3" fill="#0f172a" />

  <!-- Smile -->
  <path d="M185 200 Q200 212 215 200" fill="none" stroke="#475569" stroke-width="2.5" stroke-linecap="round" />

  <!-- Floating Tech Badge: Code Bracket -->
  <g transform="translate(60, 110)">
    <rect width="44" height="44" rx="12" fill="#0f172a" stroke="#3b82f6" stroke-width="1.5" />
    <text x="22" y="27" font-family="'JetBrains Mono', monospace" font-size="14" font-weight="bold" fill="#38bdf8" text-anchor="middle">&lt;/&gt;</text>
  </g>

  <!-- Floating Tech Badge: Database -->
  <g transform="translate(300, 110)">
    <rect width="44" height="44" rx="12" fill="#0f172a" stroke="#8b5cf6" stroke-width="1.5" />
    <path d="M14 16 C14 14, 30 14, 30 16 C30 18, 14 18, 14 16 Z M14 20 C14 22, 30 22, 30 20 M14 24 C14 26, 30 26, 30 24" fill="none" stroke="#a78bfa" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Terminal Status Pill at bottom -->
  <g transform="translate(130, 345)">
    <rect width="140" height="28" rx="14" fill="#0f172a" stroke="#22c55e" stroke-width="1.5" />
    <circle cx="145" cy="359" r="4" fill="#22c55e" />
    <text x="160" y="363" font-family="'JetBrains Mono', monospace" font-size="11" font-weight="600" fill="#e2e8f0">STATUS: ACTIVE</text>
  </g>
</svg>

